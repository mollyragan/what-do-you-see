<!DOCTYPE html>
<html>
<head>
  <title>admin — what do you see</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
* { box-sizing: border-box; }

body {
  font-family: sans-serif;
  margin: 0;
  font-size: 14px;
  color: black;
  background: white;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* --- LOGIN PANEL --- */
#loginPanel {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  background: white;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s ease;
}

#loginPanel.expanded {
  border-color: rgba(0,0,0,0.1);
}

#loginBar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
}

#loginBtn {
  all: unset;
  font-size: 14px;
  color: black;
  cursor: pointer;
  transition: all 0.2s ease;
}

#loginBtn:hover,
#loginBtn:active {
  font-weight: bold;
}

#status {
  font-size: 12px;
  opacity: 0.6;
  margin-left: 4px;
}

#loginInputs {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.3s ease, padding 0.3s ease;
  padding: 0 16px;
}

#loginInputs > .inner {
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#loginPanel.expanded #loginInputs {
  grid-template-rows: 1fr;
  padding-bottom: 14px;
}

#loginInputs input {
  width: 100%;
  border: none;
  background: #f0f0f0;
  padding: 10px 12px;
  font-size: 16px; /* 16px prevents iOS zoom */
  border-radius: 6px;
  font-family: inherit;
}

#loginInputs input:focus { outline: none; background: #e8e8e8; }

#loginSubmit {
  width: 100%;
  background: black;
  color: white;
  border: none;
  padding: 11px;
  font-size: 14px;
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  letter-spacing: 0.04em;
  margin-top: 2px;
}

#loginSubmit:active { background: #333; }

/* --- MAIN LAYOUT --- */
#adminWrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 16px;
  padding-top: calc(52px + 16px); /* space for fixed login bar */
  gap: 14px;
  min-height: 0;
}

/* --- DROPZONE --- */
#dropZone {
  flex: 1;
  min-height: 0;
  border: 1px dashed rgba(0,0,0,0.4);
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s ease;
  background: #fafafa;
  border-radius: 6px;
}

#dropZone.active { border-color: black; }

#dropZoneText {
  font-size: 14px;
  color: rgba(0,0,0,0.5);
  pointer-events: none;
  line-height: 1.7;
}

#previewGrid {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 2px;
  overflow: hidden;
  align-content: start;
}

#previewGrid img {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  display: block;
}

/* --- PROGRESS --- */
#progressWrap {
  display: none;
}

#progressBar {
  width: 0%;
  height: 3px;
  background: black;
  transition: width 0.2s ease;
  border-radius: 2px;
}

#progressLabel {
  font-size: 12px;
  color: rgba(0,0,0,0.6);
  margin-top: 6px;
  text-align: center;
}

/* --- UPLOAD BUTTON --- */
#submit {
  width: 100%;
  background: black;
  color: white;
  border: none;
  padding: 16px;
  font-size: 16px;
  font-family: inherit;
  letter-spacing: 0.05em;
  cursor: pointer;
  border-radius: 6px;
  flex-shrink: 0;
}

#submit:hover { background: #222; }
#submit:active { background: #444; }
#submit:disabled { background: #999; cursor: default; }
  </style>
</head>
<body>

<div id="loginPanel">
  <div id="loginBar">
    <button id="loginBtn">Log In</button>
    <span id="status"></span>
  </div>
  <div id="loginInputs">
    <div class="inner">
      <input type="email" id="email" placeholder="Email" autocomplete="email" />
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
      <button id="loginSubmit">Log In</button>
    </div>
  </div>
</div>

<div id="adminWrapper">

  <div id="dropZone">
    <div id="dropZoneText">
      Drag &amp; drop images<br>or tap to select<br><br>
      <span style="font-size:12px;opacity:0.6;">bulk upload supported<br>auto-cropped to 3:4</span>
    </div>
    <div id="previewGrid"></div>
  </div>

  <input type="file" id="fileInput" accept="image/*" multiple style="display:none;" />

  <div id="progressWrap">
    <div id="progressBar"></div>
    <div id="progressLabel"></div>
  </div>

  <button id="submit">Upload</button>

</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPABASE_URL      = 'https://fyogbaeayboxjhleaqoj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5b2diYWVheWJveGpobGVhcW9qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjczOTMxNDcsImV4cCI6MjA4Mjk2OTE0N30.JGa6qT6IkcNCJRxV5FYDFUiH1QWSKHABJ_Qu7BNV5m8';
const ADMIN_USER_ID     = '1af44252-2b44-4f0d-8854-5d53a4ca2e5a';
const STORAGE_BUCKET    = 'images';
const MASTER_MAX_W      = 1000;
const THUMB_W           = 400;
const JPEG_QUALITY      = 0.82;

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
let currentFiles = [];

// ── LOGIN ────────────────────────────────────────────────
const loginPanel    = document.getElementById('loginPanel');
const loginBtn      = document.getElementById('loginBtn');
const loginSubmitBtn = document.getElementById('loginSubmit');
const emailInput    = document.getElementById('email');
const passwordInput = document.getElementById('password');
const status        = document.getElementById('status');

function updateLoginButton() {
  loginBtn.innerText = currentUser ? 'Log Out' : 'Log In';
  status.innerText = currentUser ? `${currentUser.email}` : '';
}

loginBtn.onclick = async () => {
  if (currentUser) {
    await supabase.auth.signOut();
    currentUser = null;
    updateLoginButton();
  } else {
    loginPanel.classList.toggle('expanded');
    if (loginPanel.classList.contains('expanded')) emailInput.focus();
  }
};

async function login() {
  const email    = emailInput.value.trim();
  const password = passwordInput.value;
  if (!email || !password) return alert('Enter email and password');

  loginSubmitBtn.disabled = true;
  loginSubmitBtn.innerText = 'Logging in…';

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  loginSubmitBtn.disabled = false;
  loginSubmitBtn.innerText = 'Log In';

  if (error) {
    alert(`Error: ${error.message}`);
  } else if (!data.user || data.user.id !== ADMIN_USER_ID) {
    alert('Not authorized');
    await supabase.auth.signOut();
  } else {
    currentUser = data.user;
    loginPanel.classList.remove('expanded');
    emailInput.value = '';
    passwordInput.value = '';
    updateLoginButton();
  }
}

loginSubmitBtn.addEventListener('click', login);

[emailInput, passwordInput].forEach(el => {
  el.addEventListener('keydown', async (e) => {
    if (e.key === 'Enter') { e.preventDefault(); await login(); }
  });
});

async function checkUser() {
  const { data } = await supabase.auth.getUser();
  if (data.user && data.user.id === ADMIN_USER_ID) {
    currentUser = data.user;
  }
  updateLoginButton();
}
checkUser();

// ── DROPZONE ─────────────────────────────────────────────
const dropZone     = document.getElementById('dropZone');
const dropZoneText = document.getElementById('dropZoneText');
const previewGrid  = document.getElementById('previewGrid');
const fileInput    = document.getElementById('fileInput');

dropZone.addEventListener('dragover',  (e) => { e.preventDefault(); dropZone.classList.add('active'); });
dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('active'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('active');
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => handleFiles(fileInput.files));

function handleFiles(files) {
  currentFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!currentFiles.length) return;

  previewGrid.innerHTML = '';
  dropZoneText.style.display = 'none';

  currentFiles.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = document.createElement('img');
      img.src = e.target.result;
      previewGrid.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
}

// ── IMAGE PROCESSING ──────────────────────────────────────
function cropAndResize(file, targetW, targetH, quality = JPEG_QUALITY) {
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);

    img.onload = () => {
      const srcW = img.naturalWidth;
      const srcH = img.naturalHeight;

      const scale = Math.max(targetW / srcW, targetH / srcH);
      const scaledW = srcW * scale;
      const scaledH = srcH * scale;

      const offsetX = (scaledW - targetW) / 2;
      const offsetY = (scaledH - targetH) / 2;

      const canvas = document.createElement('canvas');
      canvas.width  = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');

      ctx.drawImage(img, -offsetX, -offsetY, scaledW, scaledH);

      canvas.toBlob((blob) => {
        URL.revokeObjectURL(url);
        resolve(blob);
      }, 'image/jpeg', quality);
    };

    img.src = url;
  });
}

async function processImage(file) {
  const masterH = Math.round(MASTER_MAX_W * 4 / 3);
  const thumbH  = Math.round(THUMB_W * 4 / 3);

  const [masterBlob, thumbBlob] = await Promise.all([
    cropAndResize(file, MASTER_MAX_W, masterH),
    cropAndResize(file, THUMB_W, thumbH),
  ]);

  return { masterBlob, thumbBlob };
}

// ── UPLOAD ────────────────────────────────────────────────
const submitBtn     = document.getElementById('submit');
const progressWrap  = document.getElementById('progressWrap');
const progressBar   = document.getElementById('progressBar');
const progressLabel = document.getElementById('progressLabel');

function setProgress(done, total) {
  const pct = Math.round((done / total) * 100);
  progressBar.style.width = pct + '%';
  progressLabel.innerText = `${done} / ${total} uploaded`;
}

submitBtn.addEventListener('click', async () => {
  if (!currentUser)         return alert('You must be logged in to upload.');
  if (!currentFiles.length) return alert('Please select at least one image.');

  submitBtn.disabled = true;
  progressWrap.style.display = 'block';
  setProgress(0, currentFiles.length);

  let successCount = 0;
  let failCount    = 0;

  for (let i = 0; i < currentFiles.length; i++) {
    const file = currentFiles[i];
    progressLabel.innerText = `Processing ${i + 1} / ${currentFiles.length}: ${file.name}`;

    try {
      const base        = `${Date.now()}-${Math.random().toString(36).slice(2)}`;
      const ext         = file.name.split('.').pop() || 'jpg';
      const origName    = `originals/${base}.${ext}`;
      const masterName  = `masters/${base}.jpg`;
      const thumbName   = `thumbs/${base}.jpg`;

      // Upload original first, before any processing
      const { error: origErr } = await supabase.storage
        .from(STORAGE_BUCKET)
        .upload(origName, file, { contentType: file.type });
      if (origErr) throw origErr;

      const { masterBlob, thumbBlob } = await processImage(file);

      const { error: masterErr } = await supabase.storage
        .from(STORAGE_BUCKET)
        .upload(masterName, masterBlob, { contentType: 'image/jpeg' });
      if (masterErr) throw masterErr;

      const { error: thumbErr } = await supabase.storage
        .from(STORAGE_BUCKET)
        .upload(thumbName, thumbBlob, { contentType: 'image/jpeg' });
      if (thumbErr) throw thumbErr;

      const { data: masterUrlData } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(masterName);
      const { data: thumbUrlData  } = supabase.storage.from(STORAGE_BUCKET).getPublicUrl(thumbName);

      const { error: dbErr } = await supabase
        .from('images')
        .insert([{
          filename:      file.name,
          url:           masterUrlData.publicUrl,
          thumbnail_url: thumbUrlData.publicUrl,
        }]);
      if (dbErr) throw dbErr;

      successCount++;
    } catch (err) {
      console.error(`Failed: ${file.name}`, err);
      failCount++;
    }

    setProgress(i + 1, currentFiles.length);
  }

  submitBtn.disabled = false;

  const msg = failCount === 0
    ? `✓ ${successCount} image${successCount !== 1 ? 's' : ''} uploaded successfully.`
    : `Done. ${successCount} succeeded, ${failCount} failed — check console for details.`;
  progressLabel.innerText = msg;

  currentFiles = [];
  previewGrid.innerHTML = '';
  dropZoneText.style.display = '';
  progressBar.style.width = '0%';
  fileInput.value = '';
});
</script>

</body>
</html>
